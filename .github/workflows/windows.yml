
name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows App
        run: |
          dotnet publish windows-agent/MobiPC.WindowsAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: MobiPC-Windows-Software
          path: publish/**
